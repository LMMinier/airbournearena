name: Validate game-dev skill

on:
  pull_request:
    paths:
      - ".agents/skills/game-dev/**"
      - ".github/workflows/game-dev-skill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill structure, scripts, and eval set
        run: python .agents/skills/game-dev/scripts/validate_skill.py
